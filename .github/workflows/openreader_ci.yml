name: OpenReader Windows CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader_windows:
    if: ${{ github.repository_owner == 'SyazwanSamad' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: 'false'

      - uses: ./.github/actions/setup-oneapi-win

      - name: Build OpenReader and Starter; check exports, smoke, and rigid parts
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\2025.0\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mkl\2025.0\env\vars.bat"
          set CMAKE_EXPORT_COMPILE_COMMANDS=ON
          cd starter
          call build_windows.bat -arch=win64 -release -nt=4
          if errorlevel 1 exit /b 1
          cd ..
          python qa-tests/dependency_removal/test_reader_build.py
          if errorlevel 1 exit /b 1
          python qa-tests/dependency_removal/test_qa_comparison.py
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_starter_api.py --reader exec/open_reader_win64.dll
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_model_queries.py --reader exec/open_reader_win64.dll
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_model_loading.py --reader exec/open_reader_win64.dll --starter exec/starter_win64.exe
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_shared_headers.py --reader exec/open_reader_win64.dll --starter exec/starter_win64.exe
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_contact_groups.py --reader exec/open_reader_win64.dll --starter exec/starter_win64.exe
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_parameters.py --reader exec/open_reader_win64.dll --starter exec/starter_win64.exe --output cbuild_parameter_ci
          if errorlevel 1 exit /b 1
          python qa-tests/reader/test_shared_tables.py --reader exec/open_reader_win64.dll --starter exec/starter_win64.exe --output cbuild_shared_tables_ci
          if errorlevel 1 exit /b 1
          python qa-tests/reader/rigid_parts/test_reader_contract.py --reader exec/open_reader_win64.dll
          if errorlevel 1 exit /b 1
          python qa-tests/reader/rigid_parts/test_openreader_conversion.py --reader exec/open_reader_win64.dll
          if errorlevel 1 exit /b 1
          python qa-tests/reader/rigid_parts/build_integration.py --starter-build starter/cbuild_starter_win64_ninja --output cbuild_openreader_ci
          if errorlevel 1 exit /b 1
          python qa-tests/reader/rigid_parts/test_starter_integration.py --reader exec/open_reader_win64.dll --binaries cbuild_openreader_ci
          if errorlevel 1 exit /b 1
